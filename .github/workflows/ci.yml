name: CI

on:
  pull_request:
    branches: [staging, main]
  workflow_call:   # lets deploy.yml run CI first, as a gate before deploying

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      # Only fatal problems: syntax errors and undefined names
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Compile all Python files
        run: python -m py_compile *.py

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # Proves the image still builds; it is not pushed anywhere
      - name: Build Docker image
        run: docker build -t doc-chat:ci .
